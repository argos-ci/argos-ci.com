name: Publish scheduled articles
permissions: {}

# Scheduled articles and changelog entries (publish date in the future) are
# excluded from the production build (see lib/api/schedule.ts). A Vercel Cron
# Job publishes them shortly after midnight UTC
# (app/api/cron/publish-scheduled/route.ts). This workflow is the backstop: it
# runs the same check once a day and triggers a Vercel production deployment
# when content's publish date has elapsed but the content is not live yet.
#
# GitHub delays scheduled runs under load (this one has fired 4 to 9 hours
# after 07:30), so don't rely on it for timing.
#
# Requires the VERCEL_DEPLOY_HOOK_URL secret: create a Deploy Hook on the
# `main` branch in Vercel (Project Settings > Git > Deploy Hooks) and save
# its URL as a repository secret.

on:
  schedule:
    # Daily at 07:30 UTC.
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Check for articles pending publication
        id: check
        run: node scripts/check-scheduled-articles.mjs >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel production deployment
        if: steps.check.outputs.pending == 'true'
        run: curl --silent --show-error --fail -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
